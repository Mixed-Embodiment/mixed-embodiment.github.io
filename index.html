<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mix and Match</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Title -->
    <h1>
        Mix and Match: Amplifying Human Demonstrations
        with Mixed-Embodiment Data
    </h1>

    <p class="authors">
        Anonymous Authors
    </p>


    <!-- Teaser -->
    <section>
        <img class="wide-image"
             src="figures/teaser.png"
             alt="Method overview">
    </section>


    <!-- Abstract -->
    <section>
        <h2>Abstract</h2>

        <p>
            Abstract coming soon.
        </p>
    </section>


    <!-- Method -->
    <section>
        <h2>Method</h2>

        <p>
            Method description coming soon.
        </p>

        <img class="wide-image"
             src="figures/system.png"
             alt="System overview">
    </section>


    <!-- Videos -->
    <section>
        <h2>Experiments</h2>

        <div class="video-grid">

            <div>
                <h3>Pick and Place</h3>
                <video controls>
                    <source src="videos/pickplace.mp4"
                            type="video/mp4">
                </video>
            </div>

            <div>
                <h3>Fold</h3>
                <video controls>
                    <source src="videos/fold.mp4"
                            type="video/mp4">
                </video>
            </div>

            <div>
                <h3>Insertion</h3>
                <video controls>
                    <source src="videos/insertion.mp4"
                            type="video/mp4">
                </video>
            </div>

        </div>
    </section>


    <!-- Results -->
    <section>
        <h2>Results</h2>

        <img class="wide-image"
             src="figures/results.png"
             alt="Experimental results">
    </section>


</div>

</body>
</html>
